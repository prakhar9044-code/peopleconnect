<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="50%" style="stop-color:#001a2e"/>
      <stop offset="100%" style="stop-color:#000d1a"/>
    </linearGradient>

    <!-- Cyan glow gradient for text -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00E5FF"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#0055FF"/>
    </linearGradient>

    <!-- Wave gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#0055FF;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00E5FF;stop-opacity:0.8"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow for title -->
    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip path for waves -->
    <clipPath id="svgClip">
      <rect width="900" height="280"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bgGrad)"/>

  <!-- Animated grid lines (horizontal) -->
  <g opacity="0.08" clip-path="url(#svgClip)">
    <line x1="0" y1="40" x2="900" y2="40" stroke="#00E5FF" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="900" y2="80" stroke="#00E5FF" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="900" y2="120" stroke="#00E5FF" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="900" y2="160" stroke="#00E5FF" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="#00E5FF" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke="#00E5FF" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="280" stroke="#00E5FF" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="280" stroke="#00E5FF" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="280" stroke="#00E5FF" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="280" stroke="#00E5FF" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="280" stroke="#00E5FF" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="280" stroke="#00E5FF" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="280" stroke="#00E5FF" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="280" stroke="#00E5FF" stroke-width="0.5"/>
  </g>

  <!-- Animated particles -->
  <g filter="url(#glow)">
    <circle cx="80" cy="60" r="2" fill="#00E5FF" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;50;60" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="180" r="1.5" fill="#0055FF" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="180;170;180" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="40" r="2.5" fill="#00E5FF" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="220" r="2" fill="#00E5FF" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="220;210;220" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="80" r="1.5" fill="#0055FF" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="150" r="2" fill="#00E5FF" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;140;150" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="240" r="1.5" fill="#00E5FF" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="100" r="2" fill="#0055FF" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="100;90;100" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="200" r="1.5" fill="#00E5FF" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="50" r="2.5" fill="#00E5FF" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Top cyan accent line with animation -->
  <rect x="0" y="0" width="900" height="3" fill="url(#waveGrad)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Main Title: PeopleConnect -->
  <text
    x="450"
    y="128"
    text-anchor="middle"
    font-family="'Trebuchet MS', 'Arial Black', sans-serif"
    font-size="72"
    font-weight="900"
    letter-spacing="4"
    fill="url(#textGrad)"
    filter="url(#strongGlow)"
  >
    PeopleConnect
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text
    x="450"
    y="168"
    text-anchor="middle"
    font-family="'Trebuchet MS', Arial, sans-serif"
    font-size="16"
    font-weight="400"
    letter-spacing="3"
    fill="#00E5FF"
    opacity="0.85"
  >
    A DIGITAL ECOSYSTEM FOR SOCIAL &amp; MENTAL WELLNESS
  </text>

  <!-- Bottom cyan wave shape -->
  <path d="M0,240 Q100,220 200,240 Q300,260 400,240 Q500,220 600,240 Q700,260 800,240 Q850,232 900,240 L900,280 L0,280 Z"
    fill="url(#waveGrad)" opacity="0.25">
    <animate attributeName="d"
      values="M0,240 Q100,220 200,240 Q300,260 400,240 Q500,220 600,240 Q700,260 800,240 Q850,232 900,240 L900,280 L0,280 Z;
              M0,248 Q100,260 200,245 Q300,228 400,248 Q500,265 600,245 Q700,228 800,248 Q850,255 900,248 L900,280 L0,280 Z;
              M0,240 Q100,220 200,240 Q300,260 400,240 Q500,220 600,240 Q700,260 800,240 Q850,232 900,240 L900,280 L0,280 Z"
      dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Bottom border line -->
  <rect x="0" y="277" width="900" height="3" fill="url(#waveGrad)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Decorative side accents -->
  <rect x="0" y="0" width="3" height="280" fill="url(#waveGrad)" opacity="0.6"/>
  <rect x="897" y="0" width="3" height="280" fill="url(#waveGrad)" opacity="0.6"/>
</svg>
